# Builds the module for each platform with emrs's reusable release workflow,
# runs the ERT suite against each file and, on a tag v<version>, attaches the binaries and
# SHA256SUMS to the release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: tohammer/emrs/.github/workflows/module-release.yml@v0.2.0
    with:
      # The same emrs release as the crate's emrs pin in Cargo.toml.
      cargo-emacs: v0.2.0
      # Windows is untested (README, Status).
      platforms: '["linux-x86_64", "linux-aarch64", "macos-aarch64"]'
      # The workflow sets EMRS_MODULE_FILE and EMRS_EL_DIR, so run-ert.sh
      # tests the released file and builds nothing. The timer delay limit
      # is the one of CI (ci.yml).
      test-command: EMRS_DIRDIFF_TEST_MAX_DELAY=150 tests/run-ert.sh
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
